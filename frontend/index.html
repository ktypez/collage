  <title>Collage Studio — สร้างคอลลาจของคุณ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
  <div class="wrap">
    
    <!-- HEADER -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">S//F</div>
        <div class="brand-name">STACK<span>//</span>FRAME</div>
      </div>
      <div class="top-actions">
        <a class="btn-friend" href="https://line.me/R/ti/p/%40484cgfku" target="_blank" rel="noopener" aria-label="เชิญสมาชิก">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
        </a>
        <a class="btn-liff" href="https://line.me/R/oaMessage/%40484cgfku/?%2A%E0%B9%80%E0%B8%A1%E0%B8%99%E0%B8%B9" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 3C6.5 3 2 6.9 2 11.7c0 3 1.6 5.6 4.1 7.2V22l2.8-1.5c1 .3 2 .4 3.1.4 5.5 0 10-3.9 10-8.7S17.5 3 12 3zM12 18.6c-4.2 0-7.6-2.7-7.6-6s3.4-6 7.6-6 7.6 2.7 7.6 6-3.4 6-7.6 6z"/>
          </svg>
          เปิดใน LINE
        </a>
      </div>
    </header>
    
    <!-- MAIN CARD -->
    <main class="studio">
      
      <!-- SECTION 01: PHOTOS -->
      <section>
        <div class="section-label"><span class="num">01</span> รูปของคุณ</div>
        <button type="button" class="upload-zone" id="uploadZone" aria-label="เลือกรูปภาพ">
          <input type="file" id="fileInput" accept="image/*" multiple>
          <div class="upload-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="upload-text">ลากหรือกดเพื่อเลือกรูป</div>
          <div class="upload-hint">JPG · PNG · WEBP — ไม่เกิน 20 รูป · รวมไม่เกิน 80MB</div>
        </button>
        <div class="preview-grid" id="previewGrid"></div>
      </section>
      
      <!-- SECTION 02: DETAILS -->
      <section style="margin-top: 24px;">
        <div class="section-label"><span class="num">02</span> รายละเอียด</div>
        
        <!-- Name field -->
        <div class="field">
          <label for="nameInput">ชื่อ</label>
          <input class="input" type="text" id="nameInput" placeholder="ชื่อของคุณ" inputmode="text" autocapitalize="words" autocomplete="name">
        </div>
        
        <!-- Date field -->
        <div class="field">
          <label for="dateInput">วันที่</label>
          <div class="date-wrap">
            <input class="input" type="text" id="dateInput" readonly placeholder="วัน/เดือน/ปี" autocomplete="off" aria-haspopup="dialog" aria-expanded="false">
            <button type="button" class="date-toggle" id="dateToggle" aria-label="เลือกวันที่" aria-expanded="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </button>
            <div class="date-popup" id="datePopup" role="dialog" aria-label="เลือกวันที่" hidden>
              <div class="cal-head">
                <button type="button" class="cal-nav" id="calPrev" aria-label="เดือนก่อนหน้า">‹</button>
                <div class="cal-title" id="calTitle"></div>
                <button type="button" class="cal-nav" id="calNext" aria-label="เดือนถัดไป">›</button>
              </div>
              <div class="cal-dow" aria-hidden="true"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div>
              <div class="cal-grid" id="calGrid"></div>
              <button type="button" class="cal-today" id="calToday">วันนี้</button>
            </div>
          </div>
        </div>
        
        <!-- Style chips -->
        <div class="field">
          <label>สไตล์</label>
          <div class="theme-chip-row">
            <button class="ochip active" data-mode="7days" aria-pressed="true">7 DAYS<span class="osub">สีตามวัน</span></button>
            <button class="ochip" data-mode="claude" aria-pressed="false">CLAUDE<span class="osub">paper</span></button>
            <button class="ochip" data-mode="lumen" aria-pressed="false">LUMEN<span class="osub">gallery</span></button>
            <button class="ochip" data-mode="post" aria-pressed="false">POST<span class="osub">postcard</span></button>
            <button class="ochip" data-mode="studio" aria-pressed="false">STUDIO<span class="osub">web</span></button>
            <button class="ochip" data-mode="cinema" aria-pressed="false">CINEMA<span class="osub">film</span></button>
            <button class="ochip" data-mode="velvet" aria-pressed="false">VELVET<span class="osub">album</span></button>
          </div>
          
          <!-- Color swatches -->
          <div class="theme-block" id="dayPresetSection">
            <div class="theme-grid" id="presetPicker">
              <button type="button" class="theme-btn" data-preset="sun" style="background:var(--swatch-red)" aria-label="แดง" aria-pressed="false"></button>
              <button type="button" class="theme-btn" data-preset="mon" style="background:var(--swatch-gold)" aria-label="ทอง" aria-pressed="false"></button>
              <button type="button" class="theme-btn" data-preset="tue" style="background:var(--swatch-pink)" aria-label="ชมพู" aria-pressed="false"></button>
              <button type="button" class="theme-btn" data-preset="wed" style="background:var(--swatch-green)" aria-label="เขียว" aria-pressed="false"></button>
              <button type="button" class="theme-btn" data-preset="thu" style="background:var(--swatch-orange)" aria-label="ส้ม" aria-pressed="false"></button>
              <button type="button" class="theme-btn" data-preset="fri" style="background:var(--swatch-blue)" aria-label="น้ำเงิน" aria-pressed="false"></button>
              <button type="button" class="theme-btn" data-preset="sat" style="background:var(--swatch-purple)" aria-label="ม่วง" aria-pressed="false"></button>
            </div>
            <div class="theme-label" id="todayLabel">today: —</div>
          </div>
          
          <!-- Select output -->
          <div class="theme-preview" id="themePreview">
            <button type="button" class="theme-preview-head" id="themePreviewHead" aria-expanded="false" aria-controls="themePreviewBody">
              <span>ตัวอย่าง output</span>
              <span class="cap" id="themePreviewCap">7 DAYS</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <div class="theme-preview-body" id="themePreviewBody">
              <img id="themePreviewImg" src="previews/pv-7days.jpg?v=20261005-1" alt="ตัวอย่าง output" loading="lazy">
            </div>
          </div>
        </div>
        
        <!-- Create button -->
        <div class="create-bar">
          <button class="btn-primary" id="submitBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <polyline points="4 17 10 11 4 5"/>
              <line x1="10" y1="17" x2="20" y2="17"/>
            </svg>
            สร้างคอลลาจ
          </button>
          <div class="status" id="status" role="status" aria-live="polite"></div>
        </div>
        
      </section>
    </main>
    
    <!-- FOOTER -->
    <footer class="footer">
      <span>STACK//FRAME<span class="dot"></span>COLLAGE STUDIO</span>
      <span>OPEN SOURCE · RENDER ON REQUEST</span>
    </footer>
  </div>
  
  <script src="shared.js?t=20261005-2"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
      if (typeof window.setDateValue === 'function') window.setDateValue(iso);
      const btn = document.getElementById('submitBtn');
      if (btn) btn.addEventListener('click', () => window.generateCollage && window.generateCollage());
    });
  </script>
</body>
</html>
