<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="สร้างคอลลาจจากรูปกลุ่ม ทั้งดาวน์โหลดหรือส่งเข้า LINE">
  <title>Collage Studio — สร้างคอลลาจของคุณ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0c; --bg-2: #111114; --surface: #17171b; --surface-2: #1e1e24;
      --border: #2a2a32; --ink: #f4f4f0; --ink-dim: #a1a1a8; --ink-faint: #6b6b74;
      --accent: #c7f464; --accent-ink: #0a0a0c; --line-accent: #4ade80; --danger: #ff5c5c;
      --radius: 16px; --radius-sm: 10px;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--font-body);
      line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }

    /* ---------- top bar ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
      background: var(--accent); color: var(--accent-ink);
      font-family: var(--font-display); font-weight: 700; font-size: 16px;
    }
    .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; }
    .brand-name span { color: var(--accent); }
    .top-actions { display: flex; gap: 10px; }
    .btn-liff, .btn-friend {
      display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px;
      border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 14px;
      transition: background .18s ease, transform .12s ease;
    }
    .btn-liff { background: rgba(74, 222, 128, .12); color: var(--line-accent); border: 1px solid rgba(74, 222, 128, .35); }
    .btn-liff:hover { background: rgba(74, 222, 128, .22); }
    .btn-liff:active, .btn-friend:active { transform: scale(.97); }
    .btn-friend { color: var(--ink-dim); border: 1px solid var(--border); }
    .btn-friend:hover { background: var(--surface); color: var(--ink); }
    .btn-friend svg { color: var(--line-accent); }
    .btn-liff svg, .btn-friend svg { flex: none; }
    @media (max-width: 520px) {
      .btn-friend { padding: 0 12px; }
      .btn-friend span.txt { display: none; }
    }

    /* ---------- studio card ---------- */
    .studio {
      margin: 20px 0 44px; padding: 24px;
      background: linear-gradient(180deg, var(--surface), var(--bg-2));
      border: 1px solid var(--border); border-radius: var(--radius);
    }
    @media (min-width: 640px) { .studio { padding: 32px; } }

    .section-label {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
      font-family: var(--font-display); font-weight: 600; font-size: 12px;
      letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint);
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .section-label .num { color: var(--accent); }

    .grid-2 { display: grid; gap: 28px; grid-template-columns: 1fr; }
    @media (min-width: 900px) { .grid-2 { grid-template-columns: 6fr 4fr; align-items: start; } }

    /* ---------- upload ---------- */
    .upload-zone {
      position: relative; min-height: 200px;
      border: 2px dashed var(--border); border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; text-align: center; padding: 24px; cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(199, 244, 100, .05); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-icon {
      width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
      background: var(--surface-2); color: var(--accent); border: 1px solid var(--border);
    }
    .upload-icon svg { width: 24px; height: 24px; }
    .upload-text { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
    .upload-hint { font-size: 13px; color: var(--ink-faint); }

    .preview-grid { margin-top: 16px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
    .preview-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); cursor: grab; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .preview-item.dragging { opacity: .4; }
    .preview-item.dragover-item { outline: 3px solid var(--accent); outline-offset: -3px; }
    .preview-num {
      position: absolute; top: 6px; left: 6px; font-family: var(--font-display); font-weight: 700; font-size: 11px;
      background: rgba(0, 0, 0, .65); color: #fff; padding: 2px 7px; border-radius: 6px;
    }
    .preview-remove {
      position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 8px;
      background: rgba(0, 0, 0, .65); color: #fff; font-size: 16px; line-height: 1;
      display: grid; place-items: center; opacity: 0; transition: opacity .15s ease;
    }
    .preview-item:hover .preview-remove, .preview-item:focus-within .preview-remove { opacity: 1; }

    /* ---------- fields ---------- */
    .field { margin-bottom: 20px; }
    .field label { display: block; margin-bottom: 8px; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink-dim); }
    .input {
      width: 100%; height: 50px; background: var(--bg-2); color: var(--ink);
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 16px;
      font-size: 16px; font-family: inherit; transition: border-color .18s ease;
    }
    .input::placeholder { color: var(--ink-faint); }
    .input:focus { outline: none; border-color: var(--accent); }

    .date-wrap { position: relative; }
    .date-toggle {
      position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-dim);
    }
    .date-toggle:hover { color: var(--accent); background: var(--surface-2); }
    .date-popup {
      position: absolute; z-index: 30; top: calc(100% + 8px); left: 0; right: 0;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
    }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .cal-title { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
    .cal-nav { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-dim); font-size: 18px; }
    .cal-nav:hover { color: var(--accent); background: var(--bg-2); }
    .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
    .cal-dow span { text-align: center; font-size: 11px; color: var(--ink-faint); font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day { aspect-ratio: 1; border-radius: 10px; font-size: 13.5px; font-weight: 500; display: grid; place-items: center; color: var(--ink); }
    .cal-day:hover { background: var(--bg-2); }
    .cal-day.is-out { color: var(--ink-faint); opacity: .5; }
    .cal-day.is-today { color: var(--accent); font-weight: 700; }
    .cal-day.is-selected { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .cal-today { margin-top: 12px; width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--border); font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--accent); }
    .cal-today:hover { background: var(--bg-2); }

    /* theme chips */
    .theme-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ochip {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--bg-2);
      padding: 9px 13px; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink);
      transition: border-color .16s ease, background .16s ease;
    }
    .ochip .osub { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--ink-faint); }
    .ochip:hover { border-color: var(--ink-faint); }
    .ochip.active { border-color: var(--accent); background: rgba(199, 244, 100, .08); color: var(--accent); }
    .ochip.active .osub { color: var(--ink-dim); }

    .theme-block { margin-top: 14px; }
    .theme-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .theme-btn { width: 44px; height: 44px; border-radius: 12px; border: 2px solid transparent; transition: transform .12s ease, border-color .12s ease; }
    .theme-btn:hover { transform: translateY(-2px); }
    .theme-btn.active { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
    .theme-label { margin-top: 10px; font-size: 13px; color: var(--ink-faint); }
    .theme-label strong { color: var(--accent); }

    .theme-preview { margin-top: 16px; }
    .theme-preview-head {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
      font-family: var(--font-display); font-weight: 600; font-size: 13px;
    }
    .theme-preview-head .cap { color: var(--accent); }
    .theme-preview-head .chev { margin-left: auto; color: var(--ink-faint); transition: transform .2s ease; }
    .theme-preview.open .theme-preview-head .chev { transform: rotate(180deg); }
    .theme-preview-body { display: none; margin-top: 10px; }
    .theme-preview.open .theme-preview-body { display: block; }
    .theme-preview-body img { width: 100%; border-radius: 12px; border: 1px solid var(--border); }

    /* ---------- create / result ---------- */
    .create-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      height: 54px; padding: 0 26px; border-radius: 14px;
      font-family: var(--font-display); font-weight: 700; font-size: 17px;
      background: var(--accent); color: var(--accent-ink); transition: filter .16s ease, transform .12s ease;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .status { display: none; width: 100%; margin-top: 12px; font-size: 13.5px; }
    .status.loading, .status.success, .status.error { display: block; }
    .status.loading { color: var(--ink-faint); }
    .status.success { color: var(--accent); }
    .status.error { color: var(--danger); }

    .result-area { margin-top: 20px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .result-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--accent); margin-bottom: 12px; }
    .result-img { width: 100%; border-radius: 12px; border: 1px solid var(--border); display: block; }
    .result-download {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 14px; width: 100%; height: 52px; border-radius: 12px;
      background: var(--accent); color: var(--accent-ink);
      font-family: var(--font-display); font-weight: 700; font-size: 15px; transition: filter .16s ease;
    }
    .result-download:hover { filter: brightness(1.06); }

    /* ---------- footer ---------- */
    .footer {
      margin-top: auto; border-top: 1px solid var(--border); padding: 20px 0 36px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink-faint);
    }
    .footer .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin: 0 10px; }

    @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- top bar -->
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">S//F</div>
        <div class="brand-name">STACK<span>//</span>FRAME</div>
      </div>
      <div class="top-actions">
        <a class="btn-friend" href="https://line.me/R/ti/p/%40484cgfku" target="_blank" rel="noopener" aria-label="เพิ่มเพื่อนบอท LINE">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <span class="txt">เพิ่มเพื่อน</span>
        </a>
        <a class="btn-liff" href="https://line.me/R/oaMessage/%40484cgfku/?%2A%E0%B9%80%E0%B8%A1%E0%B8%99%E0%B8%B9" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 3 1.6 5.6 4.1 7.2V22l2.8-1.5c1 .3 2 .4 3.1.4 5.5 0 10-3.9 10-8.7S17.5 3 12 3zM12 18.6c-4.2 0-7.6-2.7-7.6-6s3.4-6 7.6-6 7.6 2.7 7.6 6-3.4 6-7.6 6z"/></svg>
          เปิดใน LINE
        </a>
      </div>
    </div>

    <!-- studio -->
    <main class="studio">
      <div class="grid-2">

        <!-- left: photos -->
        <section>
          <div class="section-label"><span class="num">01</span> รูปของคุณ</div>
          <div class="upload-zone" id="uploadZone">
            <input type="file" id="fileInput" accept="image/*" multiple>
            <div class="upload-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="upload-text">ลากหรือกดเพื่อเลือกรูป</div>
            <div class="upload-hint">JPG · PNG · WEBP — ไม่เกิน 20 รูป</div>
          </div>
          <div class="preview-grid" id="previewGrid"></div>
        </section>

        <!-- right: fields + create -->
        <section>
          <div class="section-label"><span class="num">02</span> รายละเอียด</div>

          <div class="field">
            <label for="nameInput">ชื่อ</label>
            <input class="input" type="text" id="nameInput" placeholder="ชื่อของคุณ" inputmode="text" autocapitalize="words" autocomplete="name">
          </div>

          <div class="field">
            <label for="dateInput">วันที่</label>
            <div class="date-wrap">
              <input class="input" type="text" id="dateInput" readonly placeholder="วัน/เดือน/ปี" autocomplete="off" aria-haspopup="dialog">
              <button type="button" class="date-toggle" id="dateToggle" aria-label="เลือกวันที่" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </button>
              <div class="date-popup" id="datePopup" role="dialog" aria-label="เลือกวันที่" hidden>
                <div class="cal-head">
                  <button type="button" class="cal-nav" id="calPrev" aria-label="เดือนก่อนหน้า">‹</button>
                  <div class="cal-title" id="calTitle"></div>
                  <button type="button" class="cal-nav" id="calNext" aria-label="เดือนถัดไป">›</button>
                </div>
                <div class="cal-dow" aria-hidden="true"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div>
                <div class="cal-grid" id="calGrid"></div>
                <button type="button" class="cal-today" id="calToday">วันนี้</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label>สไตล์</label>
            <div class="theme-chip-row">
              <button class="ochip active" data-mode="7days">7 DAYS<span class="osub">สีตามวัน</span></button>
              <button class="ochip" data-mode="rack">RACK<span class="osub">rack</span></button>
              <button class="ochip" data-mode="noc">NOC<span class="osub">dashboard</span></button>
              <button class="ochip" data-mode="claude">CLAUDE<span class="osub">paper</span></button>
              <button class="ochip" data-mode="moss">MOSS<span class="osub">organic</span></button>
              <button class="ochip" data-mode="brut">BRUT<span class="osub">raw</span></button>
            </div>
            <div class="theme-block" id="dayPresetSection">
              <div class="theme-grid" id="presetPicker">
                <button type="button" class="theme-btn" data-preset="sun" style="background:linear-gradient(135deg,#DC2626,#F87171)" title="อาทิตย์"></button>
                <button type="button" class="theme-btn" data-preset="mon" style="background:linear-gradient(135deg,#854D0E,#FACC15)" title="จันทร์"></button>
                <button type="button" class="theme-btn" data-preset="tue" style="background:linear-gradient(135deg,#BE185D,#F472B6)" title="อังคาร"></button>
                <button type="button" class="theme-btn" data-preset="wed" style="background:linear-gradient(135deg,#047857,#34D399)" title="พุธ"></button>
                <button type="button" class="theme-btn" data-preset="thu" style="background:linear-gradient(135deg,#C2410C,#FB923C)" title="พฤหัสบดี"></button>
                <button type="button" class="theme-btn" data-preset="fri" style="background:linear-gradient(135deg,#1D4ED8,#60A5FA)" title="ศุกร์"></button>
                <button type="button" class="theme-btn" data-preset="sat" style="background:linear-gradient(135deg,#7C3AED,#A78BFA)" title="เสาร์"></button>
              </div>
              <div class="theme-label" id="todayLabel">today: —</div>
            </div>
            <div class="theme-preview" id="themePreview">
              <div class="theme-preview-head" id="themePreviewHead">
                <span>ตัวอย่าง output</span>
                <span class="cap" id="themePreviewCap">7 DAYS</span>
                <span class="chev" aria-hidden="true">▼</span>
              </div>
              <div class="theme-preview-body"><img id="themePreviewImg" src="previews/pv-min.jpg" alt="ตัวอย่าง output"></div>
            </div>
          </div>

          <div class="create-bar">
            <button class="btn-primary" id="submitBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6"/><path d="M12 19h9"/></svg>
              สร้างคอลลาจ
            </button>
            <div class="status" id="status" role="status" aria-live="polite"></div>
          </div>
        </section>

      </div>
    </main>

    <footer class="footer">
      <span>STACK//FRAME <span class="dot"></span> COLLAGE STUDIO</span>
      <span>OPEN SOURCE · RENDER ON REQUEST</span>
    </footer>
  </div>

  <script src="shared.js?t=20260101"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
      if (typeof window.setDateValue === 'function') window.setDateValue(iso);
      const btn = document.getElementById('submitBtn');
      if (btn) btn.addEventListener('click', () => window.generateCollage && window.generateCollage());
    });
  </script>
</body>
</html>
