<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="สร้างรูปคอลลาจจากภาพถ่ายกลุ่ม ส่งเข้ากลุ่ม LINE ได้ทันที">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta property="og:title" content="สร้างรูปคอลลาจ">
  <meta property="og:description" content="รวมรูปภาพเป็นคอลลาจสวยๆ ส่งเข้ากลุ่ม LINE">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>สร้างรูปคอลลาจ - Collage Maker</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f8f8;
      --bg-muted: #f2f2f2;
      --surface: #ffffff;
      --foreground: #2c2c2e;
      --foreground-muted: #6e6e73;
      --border: #e5e5ea;
      --border-hover: #b5b5bd;
      --ring: #2c2c2e;
      --primary: #2c2c2e;
      --primary-foreground: #ffffff;
      --destructive: #ef4444;
      --success-bg: #f0fdf4;
      --warning-bg: #fefce8;
      --error-bg: #fef2f2;
      --radius: 0.75rem;
      --font-sans: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --bg-muted: #1c1c1e;
        --surface: #1c1c1e;
        --foreground: #f5f5f7;
        --foreground-muted: #98989f;
        --border: #2c2c2e;
        --border-hover: #56565d;
        --ring: #e5e5ea;
        --primary: #f5f5f7;
        --primary-foreground: #1c1c1e;
        --success-bg: #062c1d;
        --warning-bg: #2a2305;
        --error-bg: #2a0a0a;
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--foreground);
      padding: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container { max-width: 420px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 16px; padding: 12px 0 8px; }
    .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.01em; margin-bottom: 2px; }
    .header p { font-size: 13px; font-weight: 400; color: var(--foreground-muted); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
    }

    .label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--foreground); letter-spacing: 0.01em; }
    .label-hint { font-weight: 300; color: var(--foreground-muted); font-size: 13px; }

    .input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--foreground);
      font-size: 16px; font-weight: 400; font-family: var(--font-sans);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 16px;
    }
    .input::placeholder { color: var(--foreground-muted); opacity: 0.6; }
    .input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ring); }

    .upload-zone {
      position: relative; border: 2px dashed var(--border);
      border-radius: var(--radius); padding: 16px 16px; text-align: center;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
      margin-bottom: 16px;
    }
    .upload-zone:hover { border-color: var(--border-hover); background: var(--bg-muted); }
    .upload-zone.dragover { border-color: var(--primary); background: var(--bg-muted); }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    }
    .upload-icon {
      width: 36px; height: 36px; margin: 0 auto 8px; border-radius: 50%;
      background: var(--bg-muted); display: flex; align-items: center; justify-content: center;
    }
    .upload-icon svg { width: 18px; height: 18px; stroke: var(--foreground-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .upload-text { font-size: 14px; font-weight: 500; margin-bottom: 2px; letter-spacing: 0.01em; }
    .upload-hint { font-size: 12px; font-weight: 300; color: var(--foreground-muted); }

    .preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .preview-grid:empty { display: none; }
    .preview-item {
      position: relative; width: 76px; height: 96px; border-radius: var(--radius);
      overflow: hidden; border: 1px solid var(--border); background: var(--bg-muted);
      cursor: grab; transition: box-shadow 0.15s, opacity 0.15s;
    }
    .preview-item:active { cursor: grabbing; }
    .preview-item.dragging { opacity: 0.4; box-shadow: 0 0 0 2px var(--primary); }
    .preview-item.dragover-item { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
    .preview-item img { width: 100%; height: 68px; object-fit: cover; display: block; }
    .preview-num {
      position: absolute; bottom: 0; left: 0; right: 0; height: 24px;
      background: var(--primary); color: var(--primary-foreground);
      font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    }
    .preview-remove {
      position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
      border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: none;
      cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s; z-index: 2;
    }
    .preview-item:hover .preview-remove { opacity: 1; }

    .theme-grid { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .theme-btn {
      width: 36px; height: 36px; border-radius: var(--radius); border: 2px solid transparent;
      cursor: pointer; transition: border-color 0.15s, transform 0.1s;
    }
    .theme-btn:hover { transform: scale(1.1); }
    .theme-btn.active { border-color: var(--foreground); box-shadow: 0 0 0 2px var(--bg); }
    .theme-label { font-size: 13px; font-weight: 300; color: var(--foreground-muted); margin-bottom: 16px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px 16px; border: none; border-radius: var(--radius);
      font-size: 16px; font-weight: 500; font-family: var(--font-sans); letter-spacing: 0.01em;
      cursor: pointer; transition: background 0.15s, opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .status {
      text-align: center; padding: 10px 12px; margin-top: 12px;
      border-radius: var(--radius); font-size: 13px; font-weight: 400; display: none;
    }
    .status.loading { display: block; background: var(--warning-bg); }
    .status.success { display: block; background: var(--success-bg); }
    .status.error { display: block; background: var(--error-bg); color: var(--destructive); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px; border: 2px solid var(--border);
      border-top-color: var(--foreground); border-radius: 50%;
      animation: spin 0.6s linear infinite; display: inline-block;
    }


  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Collage Maker</h1>
      <p>สร้างคอลลาจจากภาพถ่าย ส่งเข้า LINE ได้ทันที</p>
    </div>



    <div class="card">
      <label class="label" for="nameInput">ชื่อ / คำอธิบาย</label>
      <input class="input" type="text" id="nameInput" placeholder="ใส่ชื่อของคุณ">

      <label class="label" for="dateInput">วันที่</label>
      <input class="input" type="date" id="dateInput">

      <label class="label">ธีมสีประจำวัน</label>
      <div class="theme-grid" id="presetPicker">
        <button type="button" class="theme-btn" data-preset="sun" style="background:linear-gradient(135deg,#DC2626,#F87171)" title="อาทิตย์"></button>
        <button type="button" class="theme-btn" data-preset="mon" style="background:linear-gradient(135deg,#854D0E,#FACC15)" title="จันทร์"></button>
        <button type="button" class="theme-btn" data-preset="tue" style="background:linear-gradient(135deg,#BE185D,#F472B6)" title="อังคาร"></button>
        <button type="button" class="theme-btn" data-preset="wed" style="background:linear-gradient(135deg,#047857,#34D399)" title="พุธ"></button>
        <button type="button" class="theme-btn" data-preset="thu" style="background:linear-gradient(135deg,#C2410C,#FB923C)" title="พฤหัสบดี"></button>
        <button type="button" class="theme-btn" data-preset="fri" style="background:linear-gradient(135deg,#1D4ED8,#60A5FA)" title="ศุกร์"></button>
        <button type="button" class="theme-btn" data-preset="sat" style="background:linear-gradient(135deg,#7C3AED,#A78BFA)" title="เสาร์"></button>
      </div>
      <div class="theme-label" id="todayLabel"></div>

      <label class="label">เลือกรูปภาพ <span class="label-hint">(แนะนำ 2+ รูป)</span></label>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="upload-icon">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="upload-text">คลิกหรือลากไฟล์มาที่นี่</div>
        <div class="upload-hint">JPG, PNG — สูงสุด 20 รูป</div>
      </div>

      <div class="preview-grid" id="previewGrid"></div>

      <button class="btn btn-primary" id="submitBtn" onclick="generateCollage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        สร้างและส่งเข้ากลุ่ม
      </button>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2010606328-7UnH1Yre';
    const API_BASE = 'https://collage-7cgv.onrender.com';

    const nameInput = document.getElementById('nameInput');
    const savedName = localStorage.getItem('collage_name');
    if (savedName) nameInput.value = savedName;
    nameInput.addEventListener('input', () => localStorage.setItem('collage_name', nameInput.value));

    liff.init({ liffId: LIFF_ID }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: window.location.href });
      }
      document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    }).catch(err => {
      setStatus('ไม่สามารถเชื่อมต่อ LINE: ' + err.message, 'error');
    });

    // Preset picker
    const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
    const DAY_LABELS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
    const today = DAYS[new Date().getDay()];
    let selectedPreset = today;
    document.getElementById('todayLabel').textContent = 'วันนี้: ' + DAY_LABELS[new Date().getDay()];

    document.querySelectorAll('.theme-btn').forEach(btn => {
      if (btn.dataset.preset === today) btn.classList.add('active');
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedPreset = btn.dataset.preset;
      });
    });

    // --- File management ---
    let imageFiles = [];        // File objects in order
    let imageUrls = [];         // object URLs for display
    const MAX_FILES = 20;
    const zone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');

    function addFiles(newFiles) {
      for (const file of newFiles) {
        if (imageFiles.length >= MAX_FILES) break;
        imageFiles.push(file);
        imageUrls.push(URL.createObjectURL(file));
      }
      renderPreview();
    }

    function removeFile(idx) {
      URL.revokeObjectURL(imageUrls[idx]);
      imageFiles.splice(idx, 1);
      imageUrls.splice(idx, 1);
      renderPreview();
    }

    function moveFile(from, to) {
      if (to < 0 || to >= imageFiles.length) return;
      [imageFiles[from], imageFiles[to]] = [imageFiles[to], imageFiles[from]];
      [imageUrls[from], imageUrls[to]] = [imageUrls[to], imageUrls[from]];
      renderPreview();
    }

    function renderPreview() {
      previewGrid.innerHTML = '';
      imageUrls.forEach((url, i) => {
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.draggable = true;
        item.dataset.idx = i;

        const img = document.createElement('img');
        img.src = url;

        const num = document.createElement('div');
        num.className = 'preview-num';
        num.textContent = i + 1;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'preview-remove';
        removeBtn.textContent = '\u00d7';
        removeBtn.onclick = (e) => { e.stopPropagation(); removeFile(i); };

        item.appendChild(img);
        item.appendChild(num);
        item.appendChild(removeBtn);
        previewGrid.appendChild(item);

        // --- Drag & drop reorder ---
        item.addEventListener('dragstart', e => {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', i);
          item.classList.add('dragging');
        });
        item.addEventListener('dragend', () => item.classList.remove('dragging'));
        item.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          item.classList.add('dragover-item');
        });
        item.addEventListener('dragleave', () => item.classList.remove('dragover-item'));
        item.addEventListener('drop', e => {
          e.preventDefault();
          item.classList.remove('dragover-item');
          const from = parseInt(e.dataTransfer.getData('text/plain'));
          const to = parseInt(item.dataset.idx);
          if (from !== to) moveFile(from, to);
        });

        // --- Touch reorder (long press to pick, tap to place) ---
        let longTimer = null;
        let touchDragging = null;
        item.addEventListener('touchstart', e => {
          longTimer = setTimeout(() => {
            touchDragging = i;
            item.classList.add('dragging');
          }, 400);
        }, { passive: true });
        item.addEventListener('touchend', () => {
          clearTimeout(longTimer);
          if (touchDragging !== null) {
            item.classList.remove('dragging');
            touchDragging = null;
          }
        });
        item.addEventListener('touchmove', () => { clearTimeout(longTimer); }, { passive: true });

        item.addEventListener('click', () => {
          if (touchDragging !== null && touchDragging !== i) {
            moveFile(touchDragging, i);
            touchDragging = null;
            item.classList.remove('dragging');
          }
        });
      });
    }

    // Upload zone: append files (not replace)
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('dragover');
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', e => {
      addFiles(e.target.files);
      fileInput.value = '';
    });

    function setStatus(text, type) {
      const el = document.getElementById('status'); el.textContent = text; el.className = 'status ' + type;
    }

    async function generateCollage() {
      const name = document.getElementById('nameInput').value;
      const date = document.getElementById('dateInput').value;
      const btn = document.getElementById('submitBtn');

      if (!imageFiles.length) {
        setStatus('กรุณาเลือกรูปภาพอย่างน้อย 1 รูป', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> กำลังสร้างภาพ...';
      setStatus('กำลังสร้างภาพ... รอสักครู่ครับ', 'loading');

      try {
        const fd = new FormData();
        fd.append('name', name);
        fd.append('date', date);
        fd.append('preset', selectedPreset);
        for (const f of imageFiles) fd.append('images', f);

        const res = await fetch(API_BASE.replace(/\/+$/, '') + '/api/collage', {
          method: 'POST',
          body: fd,
        });
        const data = await res.json();

        if (!data.success) {
          throw new Error(data.error || 'เกิดข้อผิดพลาด ไม่ทราบสาเหตุ');
        }

        setStatus('กำลังส่งเข้ากลุ่ม LINE...', 'loading');

        await liff.sendMessages([{
          type: 'image',
          originalContentUrl: data.imageUrl,
          previewImageUrl: data.imageUrl,
        }]);

        setStatus('ส่งสำเร็จแล้ว!', 'success');

        setTimeout(() => liff.closeWindow(), 1500);
      } catch (err) {
        setStatus(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> สร้างและส่งเข้ากลุ่ม';
      }
    }
  </script>
</body>
</html>
