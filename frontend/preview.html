<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตัวอย่างธีมสี - Collage Maker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090b; color: #fafafa; padding: 24px 16px;
    }
    .container { max-width: 420px; margin: 0 auto; }
    h1 { font-size: 20px; text-align: center; margin-bottom: 24px; font-weight: 700; }
    .card {
      background: #18181b; border: 1px solid #27272a; border-radius: 12px;
      overflow: hidden; margin-bottom: 16px;
    }
    .header-preview {
      height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .header-preview .name { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .header-preview .date { font-size: 16px; opacity: 0.9; }
    .label-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #09090b;
    }
    .day-label { font-size: 14px; font-weight: 600; }
    .color-hex { font-size: 12px; color: #71717a; font-family: monospace; }
    .body-preview {
      padding: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    .placeholder {
      aspect-ratio: 1; border-radius: 8px; background: #27272a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ตัวอย่างธีมสีแต่ละวัน</h1>
    <div id="themes"></div>
  </div>
  <script>
    const THEMES = {
      sun: { g: ['#DC2626','#EF4444','#F87171'], name: 'อาทิตย์', day: 'อาทิตย์' },
      mon: { g: ['#854D0E','#CA8A04','#FACC15'], name: 'จันทร์', day: 'จันทร์' },
      tue: { g: ['#BE185D','#EC4899','#F472B6'], name: 'อังคาร', day: 'อังคาร' },
      wed: { g: ['#047857','#059669','#34D399'], name: 'พุธ', day: 'พุธ' },
      thu: { g: ['#C2410C','#EA580C','#FB923C'], name: 'พฤหัสบดี', day: 'พฤหัสบดี' },
      fri: { g: ['#1D4ED8','#3B82F6','#60A5FA'], name: 'ศุกร์', day: 'ศุกร์' },
      sat: { g: ['#7C3AED','#8B5CF6','#A78BFA'], name: 'เสาร์', day: 'เสาร์' },
    };
    const container = document.getElementById('themes');
    for (const [key, t] of Object.entries(THEMES)) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="header-preview" style="background:linear-gradient(180deg,${t.g[0]},${t.g[1]} 50%,${t.g[2]})">
          <div class="name">ตัวอย่างชื่อ</div>
          <div class="date">วันที่ 27 กรกฎาคม 2568</div>
        </div>
        <div class="label-row">
          <span class="day-label">${t.day}</span>
          <span class="color-hex">${t.g.join(' → ')}</span>
        </div>
      `;
      container.appendChild(card);
    }
  </script>
</body>
</html>
