<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ธีมสีประจำวัน — Collage Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 24px; color: #333; }
    h1 { font-size: 20px; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 20px; }
    .themes { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    .mockup {
      background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.1);
      width: 300px; transition: transform .15s;
    }
    .mockup:hover { transform: scale(1.02); }
    .mockup.today { outline: 3px solid #06c755; }
    .mockup-tag {
      text-align: center; font-size: 12px; font-weight: 600; padding: 5px;
      background: #06c755; color: #fff;
    }
    .mockup-label {
      text-align: center; font-size: 14px; font-weight: 700; padding: 8px 0 0;
    }
    .mockup-header {
      padding: 24px 20px; text-align: center; color: #fff;
    }
    .mockup-header .title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .mockup-header .date { font-size: 12px; opacity: .85; }
    .mockup-divider { height: 6px; }
    .mockup-body {
      padding: 16px 16px 20px;
    }
    .mockup-grid {
      display: grid; gap: 12px;
    }
    .mockup-card {
      background: #fff; border-radius: 12px; padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .mockup-card .img {
      border-radius: 10px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .mockup-footer {
      padding: 8px 16px; text-align: center; font-size: 11px; font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #e0e0e0; }
      .mockup { background: #2a2a2a; }
    }
  </style>
</head>
<body>
  <h1>🎨 ธีมสีประจำวัน — Collage Mockup</h1>
  <p class="subtitle">เลือก 5 รูป (3 columns) — ตัวอย่างวิธีที่แต่ละธีมจะแสดงผล</p>
  <div class="themes" id="grid"></div>
  <script>
    const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
    const LABELS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
    const THEMES = {
      sun: { g: ['#3B050A','#8F1018','#B81E28'], d: '#F0B400', bg: '#F5ECEC' },
      mon: { g: ['#4A3000','#8B6914','#C9A96E'], d: '#8B4513', bg: '#F5F0E8' },
      tue: { g: ['#4A0E2E','#8B1A5E','#C4448E'], d: '#FFD700', bg: '#F5ECF0' },
      wed: { g: ['#043528','#0A6B53','#0E8F6E'], d: '#F4C430', bg: '#ECF5F0' },
      thu: { g: ['#4A1500','#8B3A0E','#C86A2C'], d: '#E8A020', bg: '#F5EEE8' },
      fri: { g: ['#052040','#0B3C87','#1A5FBF'], d: '#5AAEFF', bg: '#ECF0F5' },
      sat: { g: ['#2A0F4A','#6B2FB8','#9B5FE0'], d: '#FFB6FF', bg: '#F0ECF5' },
    };
    const SAMPLE = [
      { name: 'Trip', cols: 3, images: ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6'] },
    ];

    const grid = document.getElementById('grid');
    const today = DAYS[new Date().getDay()];

    DAYS.forEach((d, i) => {
      const t = THEMES[d];
      const isToday = d === today;
      const sample = SAMPLE[0];
      const rows = Math.ceil(sample.images.length / sample.cols);

      const wrap = document.createElement('div');
      wrap.className = 'mockup' + (isToday ? ' today' : '');
      if (isToday) wrap.innerHTML = '<div class="mockup-tag">วันนี้</div>';

      wrap.innerHTML += `
        <div class="mockup-label" style="color:${t.g[2]}">${LABELS[i]}</div>
        <div class="mockup-header" style="background:linear-gradient(135deg,${t.g[0]},${t.g[1]},${t.g[2]})">
          <div class="title">${sample.name}</div>
          <div class="date">วันที่ ${new Date().getDate()} ${['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'][new Date().getMonth()]} ${new Date().getFullYear() + 543}</div>
        </div>
        <div class="mockup-divider" style="background:${t.d}"></div>
        <div class="mockup-body" style="background:${t.bg}">
          <div class="mockup-grid" style="grid-template-columns:repeat(${sample.cols},1fr)">
            ${sample.images.map(c => `<div class="mockup-card"><div class="img" style="background:${c}">${c}</div></div>`).join('')}
          </div>
        </div>
        <div class="mockup-footer" style="background:${t.g[0]};color:${t.tc || '#fff'}">240px &middot; 5 รูป &middot; ${sample.cols} columns</div>
      `;
      grid.appendChild(wrap);
    });
  </script>
</body>
</html>
