<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ธีมสีประจำวัน — Collage Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 24px; color: #333; }
    h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.08); width: 220px; }
    .header { padding: 20px 16px; text-align: center; }
    .header .day { font-size: 22px; font-weight: 700; }
    .header .sub { font-size: 12px; margin-top: 4px; opacity: .85; }
    .color-bar { display: flex; height: 40px; }
    .color-bar div { flex: 1; }
    .info { padding: 12px 16px; font-size: 12px; }
    .info .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
    .sample-images {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 0 16px 16px;
    }
    .sample-images div {
      aspect-ratio: 1; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #fff; font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #e0e0e0; }
      .card { background: #2a2a2a; }
    }
  </style>
</head>
<body>
  <h1>🎨 ธีมสีประจำวัน — Collage Maker</h1>
  <div class="grid" id="grid"></div>
  <script>
    const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
    const LABELS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
    const COLORS = {
      sun: ['#3B050A','#8F1018','#B81E28'],
      mon: ['#4A3000','#8B6914','#C9A96E'],
      tue: ['#4A0E2E','#8B1A5E','#C4448E'],
      wed: ['#043528','#0A6B53','#0E8F6E'],
      thu: ['#4A1500','#8B3A0E','#C86A2C'],
      fri: ['#052040','#0B3C87','#1A5FBF'],
      sat: ['#2A0F4A','#6B2FB8','#9B5FE0'],
    };
    const DIVIDERS = { sun:'#F0B400', mon:'#8B4513', tue:'#FFD700', wed:'#F4C430', thu:'#E8A020', fri:'#5AAEFF', sat:'#FFB6FF' };
    const SAMPLE_COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];

    const grid = document.getElementById('grid');
    const today = DAYS[new Date().getDay()];

    DAYS.forEach((d, i) => {
      const c = COLORS[d];
      const dv = DIVIDERS[d];
      const isToday = d === today;
      const card = document.createElement('div');
      card.className = 'card';
      if (isToday) card.style.outline = '3px solid #06c755';

      card.innerHTML = `
        <div class="header" style="background:linear-gradient(135deg,${c[0]},${c[1]},${c[2]});color:#fff">
          <div class="day">${LABELS[i]}</div>
          <div class="sub">${d}${isToday ? ' — วันนี้' : ''}</div>
        </div>
        <div class="color-bar">
          <div style="background:${c[0]}"></div>
          <div style="background:${c[1]}"></div>
          <div style="background:${c[2]}"></div>
        </div>
        <div class="info">
          <div class="row"><span>Divider</span><span><span class="swatch" style="background:${dv}"></span>${dv}</span></div>
          <div class="row"><span>Stop 1</span><span>${c[0]}</span></div>
          <div class="row"><span>Stop 2</span><span>${c[1]}</span></div>
          <div class="row"><span>Stop 3</span><span>${c[2]}</span></div>
        </div>
        <div class="sample-images">
          ${SAMPLE_COLORS.slice(0, 3).map(sc => `<div style="background:${sc}"></div>`).join('')}
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
