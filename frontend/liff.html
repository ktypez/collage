  <script src="shared.js?t=20260925-6"></script>
  <script>
    /* ==========================================================================
       LIFF wrapper — the ONLY page-specific logic here. Everything else
       (calendar, theme picker, upload, preview, generateCollage API call) is
       shared.js. This file adds the LINE layer: init/login, send-to-group, and
       re-auth when the token expires/revokes mid-session.
       ========================================================================== */

    const LIFF_ID = '2010606328-7UnH1Yre';
    const REQUIRED_SCOPES = ['openid', 'profile', 'chat_message.write'];
    const statusEl = document.getElementById('status');

    // NOTE: not named `setStatus` — that name is a global in shared.js with a
    // different signature (el, text, type); shadowing it would break generate.
    function liffStatus(text, type) {
      if (!statusEl) return;
      statusEl.textContent = text;
      statusEl.className = 'status ' + type;
    }

    /* ---- LIFF init ----
       Request the scopes the app uses up-front (chat_message.write is required
       by liff.sendMessages) so LINE shows the consent screen and we never hit
       "user doesn't grant required permissions yet" at send time.
       ------------------------------------------------------------------ */
    function isPermissionError(err) {
      const msg = String((err && (err.message || err.code || err)) || '');
      return /permission|scope|grant|authoriz/i.test(msg);
    }

    function initLiff() { return liff.init({ liffId: LIFF_ID }); }

    function ensureLogin() {
      if (liff.isLoggedIn()) return Promise.resolve();
      return Promise.resolve(liff.login({ redirectUri: window.location.href, scope: REQUIRED_SCOPES }));
    }

    // Does the current token actually include chat_message.write? (LIFF v2.27+)
    function hasGrantedSendScope() {
      if (typeof liff.permission === 'undefined' || typeof liff.permission.getGrantedAll !== 'function') {
        return Promise.resolve(true); // can't check → let sendMessages surface errors
      }
      return liff.permission.getGrantedAll().then(
        scopes => Array.isArray(scopes) && scopes.includes('chat_message.write'),
        () => true
      );
    }

    // A revoked/expired token can't be fixed by re-init — must re-authenticate
    // so LINE issues a fresh token (and re-shows consent for missing scopes).
    function forceReAuth(message) {
      if (message) liffStatus(message, 'loading');
      try { liff.logout(); } catch (e) {}
      liff.login({ redirectUri: window.location.href, scope: REQUIRED_SCOPES });
    }

    /**
     * Send image via LIFF, tagging the error so generateCollage can decide
     * whether a re-login fixes it (revoked/expired token) or the user just
     * never granted the send scope.
     */
    async function sendImage(imageUrl) {
      const messages = [{ type: 'image', originalContentUrl: imageUrl, previewImageUrl: imageUrl }];
      try {
        await liff.sendMessages(messages);
        return;
      } catch (err) {
        const msg = String((err && (err.message || err.code)) || err);
        if (/permission|scope|grant|authoriz/i.test(msg)) {
          throw Object.assign(err, { needsScope: true });
        }
        if (/revoked|expired|unauthorized|invalid.*token|access token/i.test(msg)) {
          throw Object.assign(err, { needsReAuth: true });
        }
        throw err;
      }
    }

    /* ---- what happens after shared.js mints the collage ---- */
    window.onCollageReady = async (data) => {
      liffStatus('กำลังส่งเข้ากลุ่ม LINE...', 'loading');
      try {
        await sendImage(data.imageUrl);
      } catch (err) {
        // Token revoked/expired OR send scope never granted — a re-login mints a
        // fresh token + re-shows consent, then the user taps the button again.
        // Any other error propagates up to shared.js which shows it in status.
        if (err && (err.needsScope || err.needsReAuth)) {
          forceReAuth(
            err.needsReAuth
              ? 'เซสชันหมดอายุ กำลังเข้าสู่ระบบใหม่...'
              : 'ยังไม่ได้ให้สิทธิ์ส่งข้อความ กำลังขอสิทธิ์ใหม่...'
          );
          return;
        }
        throw err;
      }
      liffStatus('ส่งสำเร็จแล้ว!', 'success');
      setTimeout(() => { try { liff.closeWindow(); } catch (e) {} }, 1500);
    };

    /* ---- boot: init -> login -> guard scope -> ready ---- */
    initLiff()
      .then(ensureLogin)
      .then(hasGrantedSendScope)
      .then(ok => {
        if (!ok) {
          let tried = false;
          try { tried = sessionStorage.getItem('collageReauth') === '1'; } catch (e) {}
          if (!tried) {
            try { sessionStorage.setItem('collageReauth', '1'); } catch (e) {}
            forceReAuth('ยังไม่ได้ให้สิทธิ์ส่งข้อความ กำลังขอสิทธิ์ใหม่...');
            return;
          }
          liffStatus('ยังไม่ได้ให้สิทธิ์ส่งข้อความ กรุณากด "สร้างและส่งเข้ากลุ่ม" อีกครั้ง', 'error');
          return;
        }
        const now = new Date();
        const today = [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, '0'),
          String(now.getDate()).padStart(2, '0'),
        ].join('-');
        setDateValue(today);
      })
      .catch(err => {
        console.error('LIFF init error:', err);
        const btn = document.getElementById('submitBtn');
        if (btn) btn.disabled = true;
        liffStatus(
          isPermissionError(err)
            ? 'ยังไม่ได้ให้สิทธิ์บอท กรุณาอนุญาตสิทธิ์ส่งข้อความให้ครบก่อนใช้งาน'
            : 'ไม่สามารถเชื่อมต่อ LINE: ' + (err.message || ''),
          'error'
        );
      });

    /* ---- wire the create button (shared.js handles the POST + status) ---- */
    document.getElementById('submitBtn').addEventListener('click', () => {
      if (typeof window.generateCollage === 'function') window.generateCollage();
    });
  </script>
