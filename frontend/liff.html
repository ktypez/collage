<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="สร้างคอลลาจและส่งเข้ากลุ่ม LINE">
  <title>Collage Studio — ส่งเข้ากลุ่ม LINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="wrap">

    <!-- top bar -->
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">S//F</div>
        <div class="brand-name">STACK<span>//</span>FRAME</div>
      </div>
      <div class="liff-banner"><span class="dot"></span> IN-LINE · ส่งเข้ากลุ่ม</div>
    </div>

    <!-- studio -->
    <main class="studio">
      <div class="grid-2">

        <!-- left: photos -->
        <section>
          <div class="section-label"><span class="num">01</span> รูปของคุณ</div>
          <div class="upload-zone" id="uploadZone">
            <input type="file" id="fileInput" accept="image/*" multiple>
            <div class="upload-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="upload-text">ลากหรือกดเพื่อเลือกรูป</div>
            <div class="upload-hint">JPG · PNG · WEBP — ไม่เกิน 20 รูป</div>
          </div>
          <div class="preview-grid" id="previewGrid"></div>
        </section>

        <!-- right: fields + create -->
        <section>
          <div class="section-label"><span class="num">02</span> รายละเอียด</div>

          <div class="field">
            <label for="nameInput">ชื่อ</label>
            <input class="input" type="text" id="nameInput" placeholder="ชื่อของคุณ" inputmode="text" autocapitalize="words" autocomplete="name">
          </div>

          <div class="field">
            <label for="dateInput">วันที่</label>
            <div class="date-wrap">
              <input class="input" type="text" id="dateInput" readonly placeholder="วัน/เดือน/ปี" autocomplete="off" aria-haspopup="dialog">
              <button type="button" class="date-toggle" id="dateToggle" aria-label="เลือกวันที่" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </button>
              <div class="date-popup" id="datePopup" role="dialog" aria-label="เลือกวันที่" hidden>
                <div class="cal-head">
                  <button type="button" class="cal-nav" id="calPrev" aria-label="เดือนก่อนหน้า">‹</button>
                  <div class="cal-title" id="calTitle"></div>
                  <button type="button" class="cal-nav" id="calNext" aria-label="เดือนถัดไป">›</button>
                </div>
                <div class="cal-dow" aria-hidden="true"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div>
                <div class="cal-grid" id="calGrid"></div>
                <button type="button" class="cal-today" id="calToday">วันนี้</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label>สไตล์</label>
            <div class="theme-chip-row">
              <button class="ochip active" data-mode="7days">7 DAYS<span class="osub">สีตามวัน</span></button>
              <button class="ochip" data-mode="rack">RACK<span class="osub">rack</span></button>
              <button class="ochip" data-mode="noc">NOC<span class="osub">dashboard</span></button>
              <button class="ochip" data-mode="claude">CLAUDE<span class="osub">paper</span></button>
              <button class="ochip" data-mode="moss">MOSS<span class="osub">organic</span></button>
              <button class="ochip" data-mode="brut">BRUT<span class="osub">raw</span></button>
            </div>
            <div class="theme-block" id="dayPresetSection">
              <div class="theme-grid" id="presetPicker">
                <button type="button" class="theme-btn" data-preset="sun" style="background:linear-gradient(135deg,#DC2626,#F87171)" title="อาทิตย์"></button>
                <button type="button" class="theme-btn" data-preset="mon" style="background:linear-gradient(135deg,#854D0E,#FACC15)" title="จันทร์"></button>
                <button type="button" class="theme-btn" data-preset="tue" style="background:linear-gradient(135deg,#BE185D,#F472B6)" title="อังคาร"></button>
                <button type="button" class="theme-btn" data-preset="wed" style="background:linear-gradient(135deg,#047857,#34D399)" title="พุธ"></button>
                <button type="button" class="theme-btn" data-preset="thu" style="background:linear-gradient(135deg,#C2410C,#FB923C)" title="พฤหัสบดี"></button>
                <button type="button" class="theme-btn" data-preset="fri" style="background:linear-gradient(135deg,#1D4ED8,#60A5FA)" title="ศุกร์"></button>
                <button type="button" class="theme-btn" data-preset="sat" style="background:linear-gradient(135deg,#7C3AED,#A78BFA)" title="เสาร์"></button>
              </div>
              <div class="theme-label" id="todayLabel">today: —</div>
            </div>
            <div class="theme-preview" id="themePreview">
              <div class="theme-preview-head" id="themePreviewHead">
                <span>ตัวอย่าง output</span>
                <span class="cap" id="themePreviewCap">7 DAYS</span>
                <span class="chev" aria-hidden="true">▼</span>
              </div>
              <div class="theme-preview-body"><img id="themePreviewImg" src="previews/pv-min.jpg" alt="ตัวอย่าง output"></div>
            </div>
          </div>

          <div class="create-bar">
            <button class="btn-primary" id="submitBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              สร้างและส่งเข้ากลุ่ม
            </button>
            <div class="status" id="status" role="status" aria-live="polite"></div>
          </div>
        </section>

      </div>
    </main>

    <footer class="footer">
      <span>STACK//FRAME <span class="dot"></span> COLLAGE STUDIO</span>
      <span>IN-LINE FLOW · LINE MESSAGING API</span>
    </footer>
  </div>

  <script src="shared.js?t=20260101"></script>
  <script>
    /* ==========================================================================
       LIFF wrapper — the ONLY page-specific logic here. Everything else
       (calendar, theme picker, upload, preview, generateCollage API call) is
       shared.js. This file adds the LINE layer: init/login, send-to-group, and
       re-auth when the token expires/revokes mid-session.
       ========================================================================== */

    const LIFF_ID = '2010606328-7UnH1Yre';
    const REQUIRED_SCOPES = ['openid', 'profile', 'chat_message.write'];
    const statusEl = document.getElementById('status');

    // NOTE: not named `setStatus` — that name is a global in shared.js with a
    // different signature (el, text, type); shadowing it would break generate.
    function liffStatus(text, type) {
      if (!statusEl) return;
      statusEl.textContent = text;
      statusEl.className = 'status ' + type;
    }

    /* ---- LIFF init ----
       Request the scopes the app uses up-front (chat_message.write is required
       by liff.sendMessages) so LINE shows the consent screen and we never hit
       "user doesn't grant required permissions yet" at send time.
       ------------------------------------------------------------------ */
    function isPermissionError(err) {
      const msg = String((err && (err.message || err.code || err)) || '');
      return /permission|scope|grant|authoriz/i.test(msg);
    }

    function initLiff() { return liff.init({ liffId: LIFF_ID }); }

    function ensureLogin() {
      if (liff.isLoggedIn()) return Promise.resolve();
      return Promise.resolve(liff.login({ redirectUri: window.location.href, scope: REQUIRED_SCOPES }));
    }

    // Does the current token actually include chat_message.write? (LIFF v2.27+)
    function hasGrantedSendScope() {
      if (typeof liff.permission === 'undefined' || typeof liff.permission.getGrantedAll !== 'function') {
        return Promise.resolve(true); // can't check → let sendMessages surface errors
      }
      return liff.permission.getGrantedAll().then(
        scopes => Array.isArray(scopes) && scopes.includes('chat_message.write'),
        () => true
      );
    }

    // A revoked/expired token can't be fixed by re-init — must re-authenticate
    // so LINE issues a fresh token (and re-shows consent for missing scopes).
    function forceReAuth(message) {
      if (message) liffStatus(message, 'loading');
      try { liff.logout(); } catch (e) {}
      liff.login({ redirectUri: window.location.href, scope: REQUIRED_SCOPES });
    }

    /**
     * Send image via LIFF, tagging the error so generateCollage can decide
     * whether a re-login fixes it (revoked/expired token) or the user just
     * never granted the send scope.
     */
    async function sendImage(imageUrl) {
      const messages = [{ type: 'image', originalContentUrl: imageUrl, previewImageUrl: imageUrl }];
      try {
        await liff.sendMessages(messages);
        return;
      } catch (err) {
        const msg = String((err && (err.message || err.code)) || err);
        if (/permission|scope|grant|authoriz/i.test(msg)) {
          throw Object.assign(err, { needsScope: true });
        }
        if (/revoked|expired|unauthorized|invalid.*token|access token/i.test(msg)) {
          throw Object.assign(err, { needsReAuth: true });
        }
        throw err;
      }
    }

    /* ---- what happens after shared.js mints the collage ---- */
    window.onCollageReady = async (data) => {
      liffStatus('กำลังส่งเข้ากลุ่ม LINE...', 'loading');
      try {
        await sendImage(data.imageUrl);
      } catch (err) {
        // Token revoked/expired OR send scope never granted — a re-login mints a
        // fresh token + re-shows consent, then the user taps the button again.
        // Any other error propagates up to shared.js which shows it in status.
        if (err && (err.needsScope || err.needsReAuth)) {
          forceReAuth(
            err.needsReAuth
              ? 'เซสชันหมดอายุ กำลังเข้าสู่ระบบใหม่...'
              : 'ยังไม่ได้ให้สิทธิ์ส่งข้อความ กำลังขอสิทธิ์ใหม่...'
          );
          return;
        }
        throw err;
      }
      liffStatus('ส่งสำเร็จแล้ว!', 'success');
      setTimeout(() => { try { liff.closeWindow(); } catch (e) {} }, 1500);
    };

    /* ---- boot: init -> login -> guard scope -> ready ---- */
    initLiff()
      .then(ensureLogin)
      .then(hasGrantedSendScope)
      .then(ok => {
        if (!ok) {
          let tried = false;
          try { tried = sessionStorage.getItem('collageReauth') === '1'; } catch (e) {}
          if (!tried) {
            try { sessionStorage.setItem('collageReauth', '1'); } catch (e) {}
            forceReAuth('ยังไม่ได้ให้สิทธิ์ส่งข้อความ กำลังขอสิทธิ์ใหม่...');
            return;
          }
          liffStatus('ยังไม่ได้ให้สิทธิ์ส่งข้อความ กรุณากด "สร้างและส่งเข้ากลุ่ม" อีกครั้ง', 'error');
          return;
        }
        setDateValue(new Date().toISOString().split('T')[0]);
      })
      .catch(err => {
        console.error('LIFF init error:', err);
        const btn = document.getElementById('submitBtn');
        if (btn) btn.disabled = true;
        liffStatus(
          isPermissionError(err)
            ? 'ยังไม่ได้ให้สิทธิ์บอท กรุณาอนุญาตสิทธิ์ส่งข้อความให้ครบก่อนใช้งาน'
            : 'ไม่สามารถเชื่อมต่อ LINE: ' + (err.message || ''),
          'error'
        );
      });

    /* ---- wire the create button (shared.js handles the POST + status) ---- */
    document.getElementById('submitBtn').addEventListener('click', () => {
      if (typeof window.generateCollage === 'function') window.generateCollage();
    });
  </script>
</body>
</html>
