<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#F6F4F0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="สร้างคอลลาจจากรูปกลุ่ม ทั้งดาวน์โหลดหรือส่งเข้า LINE" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- the primary face is needed for the first paint and for every collage
		     render; the rest load on demand -->
		<link rel="preload" href="/fonts/NotoSansThai.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
